[project]
name = "open-document-skills"
version = "0.4.0"
description = "Agent skills for OpenDocument Format files"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
odf = ["odfpy>=1.4.0"]
scholarly = ["bibtexparser>=1.4"]
dev = ["pytest>=8.0", "ruff>=0.9", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["lib"]

[tool.coverage.report]
fail_under = 30
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["examples/output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
