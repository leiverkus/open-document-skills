[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-document-lib"
version = "1.14.0"
description = "Standard-library toolkit for reading, editing, and writing OpenDocument Format files (ODT, ODP, ODS, ODG)"
readme = "docs/library-api.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Patrick Leiverkus" }]
keywords = [
    "opendocument",
    "odf",
    "odt",
    "ods",
    "odp",
    "odg",
    "libreoffice",
    "xml",
    "documents",
    "spreadsheets",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/leiverkus/open-document-skills"
Repository = "https://github.com/leiverkus/open-document-skills"
Changelog = "https://github.com/leiverkus/open-document-skills/blob/main/CHANGELOG.md"
Issues = "https://github.com/leiverkus/open-document-skills/issues"

[project.optional-dependencies]
odf = ["odfpy>=1.4.0"]
scholarly = ["bibtexparser>=1.4"]
validate = ["lxml>=4.9"]
render = ["Pillow>=10"]
dev = ["pytest>=8.0", "ruff>=0.9", "pytest-cov>=5.0", "hypothesis>=6.0", "build>=1.0", "mypy>=1.8", "Pillow>=10"]

[tool.setuptools]
packages = ["odf_lib"]

[tool.setuptools.package-data]
odf_lib = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["odf_lib"]

[tool.coverage.report]
fail_under = 30
show_missing = true

[tool.mypy]
python_version = "3.10"
# Optional deps (lxml, bibtexparser) are lazily imported; don't fail on them.
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["examples/output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
