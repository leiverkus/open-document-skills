[project]
name = "open-document-skills"
version = "0.1.5"
description = "Agent skills for OpenDocument Format files"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
odf = ["odfpy>=1.4.0"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["examples/output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
