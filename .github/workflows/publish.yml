name: Publish

# Builds the open-document-lib distribution and uploads it to PyPI when a
# GitHub release is published. Uses PyPI Trusted Publishing (OIDC) — no API
# token is stored. The trusted publisher must be registered once on PyPI
# (project open-document-lib, this repo, workflow publish.yml, environment
# pypi); see CONTRIBUTING.md.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
