name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install LibreOffice, Poppler, and Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils pandoc
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: pip install 'bibtexparser>=1.4,<2' 'lxml>=4.9' 'hypothesis>=6.0'
      - run: python -m unittest discover -s tests

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install LibreOffice and Pandoc
        run: sudo apt-get install -y libreoffice pandoc
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov 'bibtexparser>=1.4,<2' 'lxml>=4.9' 'hypothesis>=6.0'
      - run: pytest tests/ --cov=lib --cov-fail-under=30 --cov-report=term-missing
