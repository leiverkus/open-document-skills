name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Install LibreOffice, Poppler, and Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils pandoc
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install 'bibtexparser>=1.4,<2' 'lxml>=4.9' 'hypothesis>=6.0' 'Pillow>=10'
      - run: python -m unittest discover -s tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: pip install mypy
      # Per-directory: the four skills have same-named modules (validate_refs.py
      # etc.) and are not packages, so one combined run would clash.
      - name: Type-check odf_lib and skills
        run: |
          mypy odf_lib
          for d in odt odp ods odg; do mypy skills/$d/scripts; done

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Install LibreOffice and Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice pandoc
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov 'bibtexparser>=1.4,<2' 'lxml>=4.9' 'hypothesis>=6.0'
      - run: pytest tests/ --cov=odf_lib --cov-fail-under=40 --cov-report=term-missing
